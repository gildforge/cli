name: Release

on:
  push:
    tags: ['v*']

# npm trusted publishing: no NPM_TOKEN anywhere. The OIDC token proves this
# workflow (this repo, this file, this environment) to npm.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: bun install --frozen-lockfile
      - run: bun run pack
      - name: Upload binaries to the release bucket (releases.gild.gg)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          for p in packages/cli-*; do
            name="${p#packages/cli-}"
            aws s3 cp "$p/bin/gild" "s3://${{ secrets.RELEASE_BUCKET }}/$VERSION/gild-$name" \
              --endpoint-url "${{ secrets.SCCACHE_ENDPOINT }}" --region auto
          done
      - name: Publish platform packages
        run: |
          set -e
          for p in packages/cli-*; do
            (cd "$p" && npm publish --access public)
          done
      - name: Publish umbrella package
        run: cd packages/gildforge && npm publish --access public
