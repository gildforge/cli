name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  setup-node-macos:
    environment: public-ci
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: bun test src/runner-setup-node.test.ts
  test:
    environment: public-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # The safe-alias test drives a real zsh alias (the shell users alias gild in).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - run: bun install --frozen-lockfile
      - run: bun test --timeout 30000
      - name: Pack and smoke-test the npm layout
        run: |
          bun run pack
          mkdir -p /tmp/nstest/node_modules/@gildforge
          cp -R packages/gildforge /tmp/nstest/node_modules/gildforge
          cp -R packages/cli-linux-x64 /tmp/nstest/node_modules/@gildforge/cli-linux-x64
          node /tmp/nstest/node_modules/gildforge/bin/gild.js --version
          HOME=/tmp/nstest node /tmp/nstest/node_modules/gildforge/bin/gild.js auth init --yes
          HOME=/tmp/nstest node /tmp/nstest/node_modules/gildforge/bin/gild.js auth status
      - name: Exercise PTY sessions through the installed npm launcher
        run: |
          cp -R node_modules/node-pty /tmp/nstest/node_modules/node-pty
          TEST_GILD_COMMAND='["node","/tmp/nstest/node_modules/gildforge/bin/gild.js"]' TEST_GILD_HOOK_COMMAND='["/tmp/nstest/node_modules/@gildforge/cli-linux-x64/bin/gild"]' bun test src/spawn.test.ts src/spawn-regressions.test.ts src/spawn-events.test.ts src/spawn-notify.test.ts src/agent-profiles.test.ts src/spawn-detach.test.ts src/spawn-nudge-pty.test.ts
