name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  setup-node-macos:
    environment: public-ci
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test src/runner-setup-node.test.ts
      - run: npm install -g npm@11.16.0
      - run: bun run pack
      - run: bun run test:install
      - run: bun run test:installed-pty
  vz-helper:
    # The macOS `vm` backend's launcher: must compile and carry the entitlement.
    environment: public-ci
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: scripts/build-vz-helper.sh
  test:
    environment: public-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # The safe-alias test drives a real zsh alias (the shell users alias gild in).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test --timeout 30000
      - run: npm install -g npm@11.16.0
      - run: bun run pack
      - name: Check packed manifests, dependency graph and warning-free global install
        run: bun run test:install
      - name: Exercise PTY sessions through the installed npm launcher
        run: bun run test:installed-pty
      - run: bun run test:install:revert
